# catalog/share-publish-targets.conf — repos bin/publish-share.sh may publish
# to. Nothing else is a target: the "-share" suffix rule went with the old
# mirror (BH-4834).
#
# One owner/name per line, matched EXACTLY: no globs, no case folding, no
# trailing space. Lines starting with # are comments. The publisher pushes a
# sanitized tree onto the target's main as a new commit, so a line here is
# permission to replace that repo's content. Add one only in a reviewed PR.
