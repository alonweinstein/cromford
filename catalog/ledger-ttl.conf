# catalog/ledger-ttl.conf — how long a `running` row in the jobs ledger may live
# before bin/jobs-watchdog.sh calls it dead, per ROW CLASS.
#
# WHY A TABLE AND NOT ONE NUMBER. The watchdog's two original thresholds only
# ever looked at the HEARTBEAT: JOBS_ORPHAN_MIN (10m) convicts a row that beat
# and stopped, JOBS_SILENT_MIN (90m) merely REPORTS a row that never beat and
# deliberately leaves its status alone. That second rule is why the hub ledger
# carried 42 running rows on the afternoon of 2026-09-15, nine of them with no
# sign of life for over an hour — eight `pr-*` review/rescue rows claimed at
# 00:59Z and still `running` fifteen hours later (#358 reaps that class), plus
# one project-3 triage row running since 2026-08-31. None of them were wrong under
# the old rule. They were simply never convicted by anything.
#
# A TTL is the other half, and this file generalises #358's single `pr-*` number
# to every class: a row past the longest its class could POSSIBLY have honestly
# taken is dead whether or not it ever beat. See docs/LEDGER-HYGIENE.md.
#
# ── Resolution order, first hit wins (bin/jobs-watchdog.sh: ttl_for) ──────────
#   1. `pr-*`            when the row's ticket key starts with `pr-`
#   2. `<kind>/<stage>`  e.g. build/execute
#   3. `<stage>`         e.g. execute
#   4. `<kind>`          e.g. triage
#   5. `default`
# A box-local override file flags/ledger-ttl.conf (same syntax, gitignored) is
# read FIRST and wins row-by-row, so an operator can widen one class on one box
# without a deploy. env LEDGER_TTL_CONF points at a third file for tests.
#
# ── WHERE THE NUMBERS COME FROM, and which evidence binds ────────────────────
# TWO SOURCES, and the SMALLER one never decides. What a stage has been OBSERVED
# to take is a lower bound on what it may take; what the harness will LET it
# take is the real ceiling, and a row is legitimately `running` right up to it.
# Setting a TTL from observation alone is how a sweep reaps live work: the
# triage p90 is 4 minutes and a triage shard is allowed 180.
#
# Enforced ceilings (the `timeout` each lane hands bin/agent-call.sh):
#   triage      10800s = 180m   bin/run-triage.sh:1025, triage_shard_timeout
#   preplan      1200s =  20m   bin/run-preplan.sh:86
#   plan         1200s =  20m   bin/run-build.sh:1039
#   execute      7200s = 120m   bin/run-build.sh:1589 (EXECUTE_TIMEOUT_SECS)
#   review       1200s =  20m   bin/run-build.sh:2313; 2400s standalone
#                               (bin/review-prs.sh:375), 2100s rescue
#   fix          4800s =  80m   bin/run-build.sh:2407
#   qa           1800s =  30m   bin/run-build.sh:2989
#   prodqa       1500s =  25m   bin/postmerge-qa.sh:218
#   revise       2400s =  40m   bin/product-cmd.sh:169
#
# Observed durations, measured 2026-09-15 against the live hub ledger: 723
# TERMINAL rows (done/failed/orphaned/parked/budget_stopped), created_at ->
# updated_at, in minutes. A job row spans its WHOLE pipeline, so a build row's
# honest life is the sum of its stages plus its fix rounds, which is why the
# build classes sit far above any single ceiling above.
#
#   class              n     p50   p90    max      ttl here   reason
#   triage           456       2     4     20      360        2x the 180m ceiling
#   pr-* (triage
#     keyed pr-<n>)   28       3     6      8      360        #358's number, kept
#   preplan           —        —     —      —      120        6x the 20m ceiling
#   build/plan        53       3    15    284      180        the 284 is real
#   build/execute     86      45    85    139      360        3x max, 3x ceiling
#   build/review      65      58    99    231      720        review + fix rounds
#   fix               —        —     —      —      720        same pipeline
#   build/decompose   26      14    21     46      180
#   build/qa           3      36    46     46      360        qa + a fix round
#   review (kind)     10       3    25     25      120
#   prodqa             7       0     4      4      120
#   migration/apply   10       0     0      0       60
#   merge              3       0     3      3       60
#   default            —       —     —      —     1440        24h: a class nobody
#                                                             sized is reported,
#                                                             not convicted
#
# The cost is asymmetric in the same direction the queue-claim release
# documents: convicting a live row releases a claim on work that is still
# running, while convicting late only delays a row nobody is working. WIDEN a
# class rather than shave it, and say why in the commit message.
#
# ── Syntax ───────────────────────────────────────────────────────────────────
#   ttl <class> <minutes>     a class's time-to-live (a non-numeric value is
#                             DROPPED, so the next file in the ladder answers)
#   set <knob> <value>        a sweep knob (below)
# Blank lines and # comments ignored. Unknown verbs ignored, so a newer file on
# an older box degrades instead of breaking.

ttl default         1440
ttl pr-*             360
ttl triage           360
ttl preplan          120
ttl plan             180
ttl execute          360
ttl review           720
ttl fix              720
ttl fix-round        720
ttl revise           720
ttl decompose        180
ttl qa               360
ttl prodqa           120
ttl apply             60
ttl migrate           60
ttl migration         60
ttl merge             60
ttl mine             120

# `review` as a STAGE is a build's review round (720m above). `review` as a KIND
# is bin/review-prs.sh / review-rescue: one standalone PR read, ceiling 2400s.
ttl review/review    120
ttl prodqa/prodqa    120

# Which classes a TTL reap may hand back to the queue. Triage-shaped work is
# cheap to redo and its ticket is otherwise never re-offered — a box only
# re-offers on its own tick if the ticket is still VISIBLE on its board, and a
# claimed-then-abandoned key usually is not. A BUILD class is deliberately
# absent: its queue row is bin/fly-pool.sh's to re-offer, and two things
# re-offering one build is how a ticket gets built twice.
set requeue_classes   triage preplan pr-*

# How many times a reaped triage/preplan row may be auto-requeued before it is
# parked for bin/blocked-resolver.sh. Three, because the box only re-offers a
# ticket on its own tick if the ticket is still visible on the board — so a row
# that has burned three requeues is not a flaky tick, it is a ticket the lane
# cannot pick up, and that is a human-shaped problem.
set requeue_max       3

# The PR reconciliation pass is the only part of this sweep that spends GitHub
# API calls, so it runs every Nth tick rather than every tick. The watchdog is a
# */5 cron, so 6 ticks is roughly every half hour — far faster than the rows it
# closes have ever mattered, and ~1/6th of the calls.
set reconcile_every   6

# How many rows one reconciliation pass may look up on GitHub. A bound, not a
# policy: whatever it does not reach this pass it reaches the next one.
set reconcile_max    40
