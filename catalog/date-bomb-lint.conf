# catalog/date-bomb-lint.conf — the patterns and thresholds bin/test-date-bomb-lint.sh
# judges with (BH-3512). Nothing about WHAT counts as a time bomb lives in the
# script; it all lives here.
#
# Resolution, first readable wins:
#   $DATE_BOMB_LINT_CONF > $HARNESS/flags/date-bomb-lint.conf (box-local, gitignored)
#   > <checkout>/catalog/date-bomb-lint.conf > /root/harness/catalog/date-bomb-lint.conf
# No conf = rc 2. Every `opt` below is required; a missing one is rc 2 too.
#
# Grammar: `opt <key> <value...>`, one per line. The value is the rest of the
# line after the key, spaces included. `#` starts a comment line.
#
# WHICH files are scanned and which files are clock-pinned is NOT repeated
# here: the lint reads the `file`, `skip` and `pin` lines of
# catalog/determinism-lint.conf (one source for "what is a test file" and "what
# pins the clock"). Its `scope` lines are not read.

# An ISO calendar date. The lint judges the year of each one it finds.
opt date_re       (19|20)[0-9]{2}-[01][0-9]-[0-3][0-9]

# A deadline-shaped key right before the date: next_*, *_until, *expir*,
# deadline, *due*, not_after, valid_to, retry_after, *_by. Lower-snake only.
# `_at` alone is a timestamp (created_at, triaged_at), not a deadline.
opt key_re        (next_[a-z_]*|[a-z_]*_until|until|[a-z_]*expir[a-z_]*|deadline|[a-z_]*due[a-z_]*|not_after|valid_to|retry_after|[a-z_]*_by)["']?[[:space:]]*[:=][[:space:]]*["']?

# A year at or past this is "never" for this repo: the safe far-future fixture.
opt max_safe_year 2099

# A year before this is a deliberate "already due" fixture, safe forever.
opt floor_year    2025

# The line feeds the date to the code under test as its clock, so the real
# clock never meets it.
opt input_re      (--now|--at|[^a-z_]now[:=]|NOW[:=]|nowMs|as_?[oO]f)
