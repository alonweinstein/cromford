# catalog/size-thresholds.conf — per-project decomposition thresholds.
#
#   <project> <max-product-lines> <max-files>
#
# Read ONLY through bin/size-threshold.sh, which resolves PER AXIS, first hit
# wins (BH-4985, the operator 2026-10-06: "that should be a database setting, not hard
# coded"):
#   1. settings row `size_gate.<axis>.<project>` (axis = lines|files) — one
#      project's own limit, edited on /config, audited in config_changes
#   2. settings row `size_gate.<axis>` — the fleet limit, seeded 700/20 by
#      worker/jobs/schema.sql (insert only when missing)
#   3. flags/size-gate-<project> on the box — "<lines> [files]", the emergency
#      lever for a box with NO worker
#   4. this file — a reviewed commit that reaches every box on harness-sync
#   5. 700 lines / 20 files — the documented fallback, and the only hardcode
#
# A ROW HERE ONLY APPLIES WHEN NO SETTINGS ROW ANSWERS. On a box with a worker
# the seeded fleet rows always answer, so neither this file nor the box flag
# wins there while that seed exists: a row added here, or a flag written on the
# box, silently does nothing. Tune a project with `size_gate.lines.<project>` /
# `size_gate.files.<project>` rows on /config instead. This file and the flag
# only matter when the worker is down, the settings cache is missing or
# unreadable, or LANE_GATE_DISABLE=1.
#
# LINES ARE PRODUCT LINES. Tests, docs, specs, lockfiles, generated files and
# Prisma migration snapshots do not count; bin/size-scope.sh owns that list and
# is the only place it lives. `bin/size-scope.sh --rules` prints it.
#
# FILES IS THE PLAN'S DECLARED `FILES:`, and only that (BH-612, 2026-09-16).
# The other list in a build dir — planned-files.txt — is every path the plan
# MENTIONS, callers and out-of-scope lists included; bin/planned-files.sh builds
# it as a deliberate over-listing because over-listing costs a serialization and
# under-listing costs a conflict. It serializes builds (bin/conflict-check.sh,
# state/claims) and it never gates size: judged against this file it decomposed
# two 45-line project-5 fixes whose prose named eighteen callers. The gate still
# prints the count, and names it `SIZE_FILES_MENTIONED: n (not gating)` when it
# is over the tolerated file limit. A plan that UNDER-declares is caught after
# the build instead, against the diff that actually shipped, and reported on its
# PR as `SIZE_DECLARATION_EXCEEDED` by bin/evidence-summary.sh — a warning, not
# a block, because by then the code is written.
#
# WHY 700/20 (the operator, 2026-10-06): measured on our own split-vs-whole builds, a
# split cost more money and more hours than building whole up to about 1,000
# shipped lines, and 139 of 371 split families stranded spend. The full numbers
# are in bin/size-threshold.sh's header.
# Before 2026-10-06: 300/12 (2026-09-12, borrowed from the 100-300 range large orgs land).
#
# A 15% TOLERANCE BAND sits above both numbers (the operator, 2026-09-16): 700/20 means
# the gate trips at 805 lines / 23 files, and a plan inside the band
# builds whole with a SIZE_TOLERATED line in the log. SIZE_GATE_TOLERANCE_PCT
# in env/global.env moves the band; 0 removes it. Split children are still
# budgeted against the nominal numbers, so the band never compounds.
#
# A plan over EITHER limit (plus the band) is handed to bin/run-decompose.sh instead of built.
# That is the SHIPPED DEFAULT since 2026-09-14 (it was warn-only from 2026-09-12,
# and warn-only watched a 1,900-line ticket build whole). To turn it back off:
# flags/size-gate-enforce-off for the whole box, SIZE_GATE_ENFORCE_<project>=0
# for one project. Raising a project's numbers keeps the gate on and moves the
# line, and that is a `size_gate.<axis>.<project>` settings row on /config,
# not a row here (see above).
#
# A row here is the fallback for when no settings row answers. If you add one,
# say why in the commit message, and add the matching settings row too, or it
# will not take effect on any box with a worker.
# No rows yet: every project is on the fleet settings rows (700/20 seeded).
