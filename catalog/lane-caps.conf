# catalog/lane-caps.conf — what ONE hub LLM lane may spend in a UTC day, and how
# many bytes of evidence it may put in front of a model. Read by
# bin/lib/lane-caps.sh (BH-1039).
#
# WHY THIS FILE EXISTS. On 2026-09-20 the alert-triage lane spent $793 in 12
# hours against a $40-$61/day baseline: the configured grok runner hit its
# context cliff, the ladder fell through to codex and then to Fable over
# OpenRouter at API prices (~$4 a session), and 150 of the 192 sessions
# concluded `handled=0 escalated=0 noise=1` — $4 to call a stale heartbeat
# noise. Nothing was broken in a way any log could show; the bill was the only
# symptom, and the only stop available to the operator was
# `TRIAGE_MAX_FAMILIES=0`, which turns the whole de-noising layer off.
#
# A SESSION CAP IS NOT A SPEND CAP. `TRIAGE_MAX_FAMILIES=4` bounds how many
# sessions a tick buys; it says nothing about what a session COSTS, and the
# incident moved the per-session price by ~100x without changing the count. So
# the bound that actually holds is stated in dollars per lane per day, here.
#
# Resolution, first hit wins (the same chain cost-caps.conf uses):
#   1. $LANE_CAPS_CONF                      the tests and one-off runs
#   2. flags/lane-caps.conf                 machine-local, no deploy needed
#   3. catalog/lane-caps.conf               THIS FILE: the reviewed commit
#   4. the built-in constants in bin/lib/lane-caps.sh (documented fallback)
# Per-lane env overrides beat all four for one run:
#   LANE_USD_CAP_<LANE>     dollars per UTC day  (`off` = uncapped)
#   LANE_BYTES_CAP_<LANE>   evidence bytes per prompt
#   LANE_NOISE_CAP_<LANE>   noise-only sessions per UTC day (`off` = unbounded)
# where <LANE> is the lane name upper-cased with every non-alphanumeric
# character replaced by `_` (alert-triage -> ALERT_TRIAGE).
#
# GRAMMAR (one directive per line, # comments and blank lines ignored):
#   lane <name> <usd_per_day> <evidence_bytes>
#   default <usd_per_day> <evidence_bytes>
#   noise <name> <sessions_per_day|off>
#   noise default <sessions_per_day|off>
# Anything else is REFUSED and named by lane_caps_legacy_rows() rather than
# silently skipped — a threshold nobody can see is the failure this file is
# about.
#
# `off` in the usd column means this lane is deliberately uncapped. It is a
# value, not an absence: a lane with no row at all takes the default, and a lane
# that should never be stopped has to say so out loud.
#
# `0` is the OPPOSITE of `off` (BH-1164): zero dollars a day, i.e. the lane is
# STOPPED. It is the spend-side spelling of `TRIAGE_MAX_FAMILIES=0`, and the
# registry declares it the same way (`zero_means: "off"`). Until BH-1164 a `0`
# here was refused as "not a positive number" and the lane silently took the
# default instead — an operator writing the tightest possible bound got the
# loosest one.

# The three unpriced hub LLM lanes (BH-1039). Revised down on 2026-09-20
# (BH-1164) after the runaway ran on past `TRIAGE_MAX_FAMILIES=0` and was
# finally stopped by a cap nobody had reviewed.
#
# WHY ALERT-TRIAGE IS $5 AND NOT $120. $120 was ~2x the $39-$61/day baseline
# this lane ran at BEFORE BH-1039 — and that baseline was itself ~150 sessions a
# day concluding `handled=0 escalated=0 noise=1`. BH-1039's deterministic
# settlement, the fix-PR brake and the cliff refusal exist precisely so that
# work never reaches a model, so the lane's honest cost is now a small fraction
# of it and a cap sized to the old number would not bind on any day short of
# another incident. $5 is the operator's own 2026-09-20 21:45Z setting.
#
# THE FAILURE MODE OF A CAP THAT IS TOO LOW is loud and reversible: the lane
# stops for the rest of the UTC day, ONE page names the spend, the cap, this
# file and the `LANE_USD_CAP_<LANE>=off` release valve, and nothing is dropped —
# the alerts sit in their quarantines and spools and the box dead-men still
# escalate. The failure mode of a cap that is too high is a four-figure bill
# nobody sees until it arrives. Raise this row when a real day trips it.
#   alert-triage  hub cron */10
#   medic         hub cron every 30 min, 1.1M input tokens/session
#   responder     hub cron */20, 3.9M tokens/call
lane alert-triage 5 20000
lane medic 90 40000
lane responder 150 60000

# Every other lane that asks — and, far more importantly, EVERY lane on a box
# that has this library but not this file (fleet-sync lands them separately;
# that is exactly how the hub came to be running on the built-in fallback on
# 2026-09-20). So the default is the TIGHTEST number, not a generous one: an
# unlisted lane is bounded hard rather than bounded in name. The same figure is
# the built-in constant in bin/lib/lane-caps.sh, and whenever that constant is
# what binds, lane_cap_usd says so in logs/lane-caps.log.
default 50 20000

# THE NOISE BUDGET (BH-1168). A session that concludes `handled=0 escalated=0`
# costs full price and produces nothing: 150 of the 192 sessions on 2026-09-20
# were exactly that, and on the 16:10-21:20Z tail it was every one of them. The
# dollar rows above catch that only after the day's money is gone, so this bound
# is stated in the unit that was actually wrong — noise-only sessions per lane
# per UTC day. A session that handles or escalates anything RESETS the count, so
# a lane doing real work is never stopped by this morning's noise.
#
# WHY 10. At the default 4 families a tick that is ~2.5 consecutive ticks of
# finding nothing, and it would have stopped the 2026-09-20 tail after its 10th
# session instead of its 11th hour. Like the dollar cap it fails LOUDLY and
# reversibly: the lane stops until 00:00Z, ONE page names the count, the budget,
# this file and the `LANE_NOISE_CAP_<LANE>=off` release valve, and nothing is
# dropped. Raise the row when a real day trips it.
#
# Only alert-triage concludes a `handled=N escalated=N` verdict today, so it is
# the only lane with a counter to bump; medic and responder take the default row
# and will start counting the day they carry a verdict.
noise alert-triage 10
noise default 10
