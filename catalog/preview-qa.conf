# catalog/preview-qa.conf — what preview QA can honestly drive, per project (BH-3438).
#
#   <project> <mode>
#
# mode is `signed-out` or `auth`. A project with no row is `auth`: preview QA
# signs in as the QA user when QA_CLERK_SECRET_KEY / QA_TEST_USER_ID are set,
# which is how every project ran before this file existed. An unknown mode or a
# malformed row also reads `auth`.
#
# `signed-out` is for a project whose Vercel PREVIEW deployments cannot sign
# anyone in. Preview QA then drives `/` and the plan's `## QA screens` signed
# out, records auth-walled routes as not covered, and a PASS from it never
# feeds a tier-1 auto-merge (bin/lib/rb/result.sh demotes it to tier-2), because
# the authed screens were never observed.
#
# Read by bin/lib/preview-qa-mode.sh. Lives under catalog/ so the Fly build pool
# gets it in the harness tarball (bin/fly-sync-harness.sh).

# Vercel previews carry no Clerk key, so a preview sign-in cannot complete.
project-5 signed-out
