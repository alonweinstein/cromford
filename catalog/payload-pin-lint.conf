# catalog/payload-pin-lint.conf — the mode, patterns and thresholds
# bin/test-payload-pin-lint.sh judges with (BH-5792). Nothing about WHAT counts
# as a whole-payload pin lives in the script; it all lives here.
#
# Resolution, first readable wins:
#   $PAYLOAD_PIN_LINT_CONF > $HARNESS/flags/payload-pin-lint.conf (box-local, gitignored)
#   > <checkout>/catalog/payload-pin-lint.conf > /root/harness/catalog/payload-pin-lint.conf
# No conf = rc 2. A conf with no `rule` line = rc 2.
#
# Grammar, one per line, `#` starts a comment line:
#   mode <warn|error>        warn: print, rc 0. error: rc 1 on a finding. Any
#                            other value is read as warn, with one stderr note.
#   opt <key> <value>        min_keys, header_lines, warn_show
#   contract_name <ERE>      a path that matches is a contract test, exempt whole
#   contract_header <ERE>    a file with a line in its first header_lines lines
#                            that matches is a contract test, exempt whole
#   rule <id> <ERE...>       an added test-file line that matches is a finding.
#                            Two lines with one id are alternatives.
#   keys <id> <ERE...>       the rule <id> fires only when the first span that
#                            matches this ERE holds at least min_keys `":` pairs
#   hint <id> <text...>      the fix text printed with a finding of rule <id>
#
# WHICH files are test files is NOT repeated here: the lint reads the `file`
# and `skip` lines of catalog/determinism-lint.conf.
#
# To make this a gate: set `mode error` and add the lint to catalog/rules-pack.tsv.

mode warn

# The `json-literal-whole` floor: a literal with fewer keys is a field set.
opt min_keys 3
# How many leading lines the contract header may sit in.
opt header_lines 15
# GitHub caps annotations per step; stdout still carries every finding.
opt warn_show 50

contract_name   \.contract\.test\.
contract_header ^[[:space:]]*(#|//)[[:space:]]*contract-test([[:space:]]|:|$)

# `jq -S .`, any flag cluster that holds S (-S, -Sc, -cS), identity filter.
rule jq-sort-whole (^|[^A-Za-z0-9_-])jq([[:space:]]+-[A-Za-z]+)*[[:space:]]+-[A-Za-z]*S[A-Za-z]*([[:space:]]+-[A-Za-z]+)*[[:space:]]+(\.|'\.'|"\.")([[:space:]]|\)|\||;|$)
hint jq-sort-whole compares the whole sorted document; select the fields this ticket owns (jq '.a, .b') or name the file a contract test

# A deep-equal of a bare response (an identifier, `await x.json()`,
# `JSON.parse(...)`) against an object literal.
rule deep-equal-whole (^|[^A-Za-z0-9_$.])assert\.deep(Strict)?Equal\([[:space:]]*(await[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*\.json\(\)|JSON\.parse\([^()]*\)|[A-Za-z_$][A-Za-z0-9_$]*)[[:space:]]*,[[:space:]]*\{
rule deep-equal-whole (^|[^A-Za-z0-9_$.])expect\([[:space:]]*(await[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*\.json\(\)|JSON\.parse\([^()]*\)|[A-Za-z_$][A-Za-z0-9_$]*)[[:space:]]*\)\.to(Strict)?Equal\([[:space:]]*\{
hint deep-equal-whole deep-equals the whole response; assert the fields this ticket owns (body.accounts, body.ready) or name the file a contract test

# A shell assertion (eq, assert*, [ = ], [[ == ]]) against a JSON object literal.
# Two lines, one id: the keys line applies to both.
# In the [ ] / [[ ]] form the literal must be the compared value.
rule json-literal-whole (^|[^A-Za-z0-9_-])(eq|assert[A-Za-z_]*)[[:space:]].*'\{"
rule json-literal-whole \[\[?[[:space:]].*[[:space:]]!?==?[[:space:]]+'\{"
keys json-literal-whole '\{"[^']*\}'
hint json-literal-whole pins a whole JSON object; pin the keys this ticket owns (jq -c '[.a, .b]') or name the file a contract test
