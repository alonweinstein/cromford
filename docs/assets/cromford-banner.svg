  <text class="mono" x="310" y="414" text-anchor="middle" font-size="11" fill="#8d8a82">Cromford Mill · 1771</text>
  <line class="d" x1="460" y1="104" x2="560" y2="70"/>
  <text class="mono" x="566" y="74" font-size="11" fill="#c8572f">Lit · ticket in work</text>
  <!-- wordmark -->
  <text class="mono" x="750" y="120" font-size="14" fill="#c8572f">Open source · Apache 2.0</text>
  <text class="disp" x="746" y="196" font-size="78" fill="#f2f0eb">CROMFORD</text>
  <text class="disp" x="748" y="246" font-size="34" fill="#f2f0eb">The software factory.</text>
  <text x="750" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8d8a82">Every other coding agent stops when the pull</text>
  <text x="750" y="318" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8d8a82">request opens. Ours starts there.</text>
  <text class="mono" x="750" y="372" font-size="13" fill="#f2f0eb">cromford.dev</text>
