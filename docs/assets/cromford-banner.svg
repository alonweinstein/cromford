<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Cromford: the software factory. A blueprint drawing of Cromford Mill beside the wordmark.">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d1c19" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#8d8a82" stroke-width="1.2"/></marker>
    <style>
      .s { fill: none; stroke: #f2f0eb; stroke-width: 1.4; opacity: .9; }
      .t { fill: none; stroke: #f2f0eb; stroke-width: 1; opacity: .5; }
      .d { fill: none; stroke: #8d8a82; stroke-width: 1; }
      .lit { fill: #c8572f; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
      .disp { font-family: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.01em; }
      .wheel { transform-origin: 584px 300px; animation: turn 24s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="420" fill="#0d0d0c"/>
  <rect width="1280" height="420" fill="url(#g)"/>
  <!-- mill elevation -->
  <line class="t" x1="70" y1="372" x2="690" y2="372"/>
  <rect class="s" x="110" y="168" width="400" height="204"/>
  <path class="s" d="M100 168 L310 122 L520 168"/>
  <rect class="s" x="440" y="92" width="20" height="56"/>
  <line class="t" x1="110" y1="219" x2="510" y2="219"/>
  <line class="t" x1="110" y1="270" x2="510" y2="270"/>
  <line class="t" x1="110" y1="321" x2="510" y2="321"/>
  <g class="t">
    <rect x="128" y="182" width="18" height="26"/><rect x="170" y="182" width="18" height="26"/><rect x="254" y="182" width="18" height="26"/><rect x="296" y="182" width="18" height="26"/><rect x="338" y="182" width="18" height="26"/><rect x="380" y="182" width="18" height="26"/><rect x="422" y="182" width="18" height="26"/><rect x="464" y="182" width="18" height="26"/>
    <rect x="128" y="233" width="18" height="26"/><rect x="170" y="233" width="18" height="26"/><rect x="212" y="233" width="18" height="26"/><rect x="254" y="233" width="18" height="26"/><rect x="338" y="233" width="18" height="26"/><rect x="380" y="233" width="18" height="26"/><rect x="422" y="233" width="18" height="26"/><rect x="464" y="233" width="18" height="26"/>
    <rect x="128" y="284" width="18" height="26"/><rect x="212" y="284" width="18" height="26"/><rect x="254" y="284" width="18" height="26"/><rect x="296" y="284" width="18" height="26"/><rect x="338" y="284" width="18" height="26"/><rect x="422" y="284" width="18" height="26"/><rect x="464" y="284" width="18" height="26"/>
    <rect x="128" y="335" width="18" height="26"/><rect x="170" y="335" width="18" height="26"/><rect x="380" y="335" width="18" height="26"/><rect x="422" y="335" width="18" height="26"/><rect x="464" y="335" width="18" height="26"/>
