<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="The line: a ticket moves through eight stations, triage, plan, build, review, merge, deploy check, production QA and close-out.">
  <defs>
    <style>
      .bg { fill: #151513; }
      .rule { stroke: #2b2a26; stroke-width: 2; }
      .rail { stroke: #c8572f; stroke-width: 3; stroke-dasharray: 1120; stroke-dashoffset: 1120; animation: rail 12s linear infinite; }
      .node { fill: #151513; stroke: #3b3a35; stroke-width: 1.5; }
      .glow { fill: none; stroke: #c8572f; stroke-width: 2; opacity: 0; }
      .done { fill: #6fae7b; opacity: 0; }
      .num { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #f2f0eb; text-anchor: middle; }
      .name { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .1em; fill: #8d8a82; text-anchor: middle; text-transform: uppercase; }
      .note { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #6b6862; text-anchor: middle; }
      .ticket rect { fill: #1c1c19; stroke: #3d3a33; }
      .ticket text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #f2f0eb; }
      .ticket .lbl { font-family: "SFMono-Regular", Menlo, monospace; font-size: 11px; fill: #c8572f; }
      .head { font-family: "SFMono-Regular", Menlo, monospace; font-size: 12px; letter-spacing: .12em; fill: #8d8a82; text-transform: uppercase; }
      @keyframes rail { 0% { stroke-dashoffset: 1120; } 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @keyframes lit { 0%, 100% { opacity: 0; } 2%, 10% { opacity: 1; } 12% { opacity: 0; } }
      @keyframes ok { 0% { opacity: 0; } 100% { opacity: 1; } }
      .s1 .glow { animation: lit 12s linear 0s infinite; } .s1 .done { animation: ok 12s steps(1) infinite; animation-delay: -10.8s; }
      .s2 .glow { animation: lit 12s linear 1.3s infinite; }
      .s3 .glow { animation: lit 12s linear 2.6s infinite; }
      .s4 .glow { animation: lit 12s linear 3.9s infinite; }
      .s5 .glow { animation: lit 12s linear 5.2s infinite; }
      .s6 .glow { animation: lit 12s linear 6.5s infinite; }
      .s7 .glow { animation: lit 12s linear 7.8s infinite; }
      .s8 .glow { animation: lit 12s linear 9.1s infinite; }
      @media (prefers-reduced-motion: reduce) { .rail { animation: none; stroke-dashoffset: 0; } .glow { animation: none !important; } }
    </style>
  </defs>
  <rect class="bg" width="1280" height="250" rx="16"/>
  <text class="head" x="40" y="40">The line</text>
  <g class="ticket" transform="translate(40 58)">
    <rect width="420" height="40" rx="8"/>
    <text x="16" y="25">#412  Export the invoices list as CSV</text>
    <text class="lbl" x="340" y="25">ai-build</text>
  </g>
  <line class="rule" x1="100" y1="160" x2="1180" y2="160"/>
  <line class="rail" x1="100" y1="160" x2="1180" y2="160"/>
  <g class="s1"><rect class="node" x="82" y="142" width="36" height="36" rx="9"/><rect class="glow" x="77" y="137" width="46" height="46" rx="12"/><text class="num" x="100" y="165">01</text><text class="name" x="100" y="204">Triage</text><text class="note" x="100" y="224">asks first</text></g>
  <g class="s2"><rect class="node" x="236" y="142" width="36" height="36" rx="9"/><rect class="glow" x="231" y="137" width="46" height="46" rx="12"/><text class="num" x="254" y="165">02</text><text class="name" x="254" y="204">Plan</text><text class="note" x="254" y="224">tests first</text></g>
  <g class="s3"><rect class="node" x="390" y="142" width="36" height="36" rx="9"/><rect class="glow" x="385" y="137" width="46" height="46" rx="12"/><text class="num" x="408" y="165">03</text><text class="name" x="408" y="204">Build</text><text class="note" x="408" y="224">red, then green</text></g>
  <g class="s4"><rect class="node" x="544" y="142" width="36" height="36" rx="9"/><rect class="glow" x="539" y="137" width="46" height="46" rx="12"/><text class="num" x="562" y="165">04</text><text class="name" x="562" y="204">Review</text><text class="note" x="562" y="224">can block</text></g>
  <g class="s5"><rect class="node" x="698" y="142" width="36" height="36" rx="9"/><rect class="glow" x="693" y="137" width="46" height="46" rx="12"/><text class="num" x="716" y="165">05</text><text class="name" x="716" y="204">Merge</text><text class="note" x="716" y="224">queued, gated</text></g>
  <g class="s6"><rect class="node" x="852" y="142" width="36" height="36" rx="9"/><rect class="glow" x="847" y="137" width="46" height="46" rx="12"/><text class="num" x="870" y="165">06</text><text class="name" x="870" y="204">Deploy</text><text class="note" x="870" y="224">verified</text></g>
  <g class="s7"><rect class="node" x="1006" y="142" width="36" height="36" rx="9"/><rect class="glow" x="1001" y="137" width="46" height="46" rx="12"/><text class="num" x="1024" y="165">07</text><text class="name" x="1024" y="204">Prod QA</text><text class="note" x="1024" y="224">signs in, checks</text></g>
  <g class="s8"><rect class="node" x="1160" y="142" width="36" height="36" rx="9"/><rect class="glow" x="1155" y="137" width="46" height="46" rx="12"/><text class="num" x="1178" y="165">08</text><text class="name" x="1178" y="204">Close-out</text><text class="note" x="1178" y="224">links + bill</text></g>
</svg>
