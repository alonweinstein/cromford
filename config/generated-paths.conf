# config/generated-paths.conf — GENERATED PER-TICKET PATHS
#
# Every glob in this file names a path the HARNESS writes, one file (or one
# directory) per ticket, that no human ever edits. They are build artefacts that
# happen to live in the repo.
#
# WHY THIS FILE EXISTS (2026-09-16, project-5). Seven of fourteen open PRs were
# DIRTY and the conductor's MERGE_TREE log said the conflicts were overwhelmingly
# add/add on exactly these paths:
#
#   Auto-merging docs/build-log/waves/TK-1251.md
#   CONFLICT (add/add): Merge conflict in docs/build-log/waves/TK-1251.md
#   Auto-merging .harness/specs/TK-1561/plan.md
#   CONFLICT (add/add): Merge conflict in .harness/specs/TK-1561/plan.md
#
# Read those two lines on PR #1634, whose branch is `ticket/TK-1602`. Neither
# file belongs to TK-1602. The branch was cut from a base that predates TK-1251
# and TK-1561 landing, it carries its own stale copy of THEIR wave doc and THEIR
# plan, and when the siblings merged first git had two unrelated additions at the
# same path. There is nothing to reconcile: main's copy is the real one and the
# branch's copy is a fossil.
#
# Left alone those conflicts walked the blocked-resolver ladder and ended in
# REBUILD FRESH — $20-30 and an hour of wall clock each, and TK-1529 was
# ABANDONED after three fresh rebuilds that each hit the same fossil again.
#
# THE RULE mc_resolve_generated applies to a path matched here, and ONLY here:
#   * the file's ticket key IS this PR's ticket  -> take OURS   (the branch)
#   * the file's ticket key is ANOTHER ticket    -> take THEIRS (main)
#   * no ticket key in the path                  -> a real conflict, hands off
# Any path NOT matched here stays a real conflict and goes to the fix round.
#
# ONE GUARD ON TOP OF THAT, and it is not optional. Not every file here is
# strictly one ticket's: docs/build-log/waves/TK-1251.md is a PARENT wave's
# narrative and each of its five children appends its own section. If the
# BRANCH's copy mentions this PR's ticket and main's copy does not, the branch is
# carrying work that only exists there, and taking main's copy would delete this
# build's own output. That case stays a real conflict.
#
# FORMAT. One shell glob per line; `#` starts a comment; blank lines ignored.
# A glob ending in `/` matches everything BELOW that directory. Matching is
# bash `case` globbing, so `*` also spans `/`.
#
# The two entries below are also compiled into bin/lib/merge-conductor-lib.sh as
# the fallback (MC_GENERATED_PATHS_DEFAULT), so a box or a pool image that has
# not yet taken this file behaves the same. Change both, or change neither.

docs/build-log/waves/*.md
.harness/specs/*/

# A CANDIDATE, DELIBERATELY NOT ENABLED YET:
#
#   tasks/platform/waves/*.md
#
# project-5 has 322 of these, one per ticket, alongside the docs/build-log ones —
# and it is in the same MERGE_TREE lines this file was written for (#1592's
# conflict was docs/build-log/waves/TK-1251.md AND tasks/platform/waves/TK-1251.md
# and nothing else, so with this glob on, that PR would have merged itself).
# It is left off because only project-5 has the directory and nobody has
# confirmed the harness is its only writer. Confirm that, uncomment it here, add
# it to MC_GENERATED_PATHS_DEFAULT, and the drift assertion in
# tests/generated-path-conflicts-test.sh will hold you to doing both.
