# config/mergify/repos/project-5.conf — project-5's Mergify queue.
#
# Format (BH-1673, frozen by BH-1697). PARSED, NEVER SOURCED: one key=value per
# line, # starts a comment, blank lines are ignored. Keys:
#   slug                 required, owner/name
#   check                repeatable, at least one: a required check name
#   merge_method         squash|merge|rebase             (default squash)
#   batch_size           int 1..10                       (default 4)
#   batch_max_wait_time  a Mergify duration              (default 3 min)
#   checks_timeout       a Mergify duration              (default 45 min)
#   max_parallel_checks  int 1..8; >8 is refused, it multiplies CI
#                        runner minutes (docs/CI-RUNNERS.md)   (default 3)
#   max_checks_retries   int 0..2, default queue only; the hotfix
#                        queue stays 0                   (default 0)
#   base                 the queue base branch           (default main)
#   queue_check          repeatable, optional: the checks queue_conditions
#                        require (default: every check=). For a repo whose
#                        corpus runs only on the batch draft (2026-09-24)
#   override             free-text reason: the repo keeps a hand-maintained
#                        .mergify.yml and sync leaves it alone
# A key left out takes its default. The CLI that reads this file is
# bin/mergify-template.sh; its header has the interface.

slug=example-org/project-5
# The required check on main (docs/MERGE-CONDUCTOR.md, the protection table).
check=Build + Unit tests
# QUEUE TUNING (BH-3439, 2026-09-29), priced against project-5's CI cost.
# CI is ONE job, `Build + Unit tests`, about 10-20 min on a MonkCI 4 vCPU VM
# (docs/CI-RUNNERS.md; the time is BH-3439's figure). project-5 is the busiest
# harness project (17 merges on 2026-09-28) and still ran the defaults
# (3 in flight).
# 6 IN FLIGHT: up to 6 concurrent CI jobs. A red head batch throws away at most
# 5 stacked batches (~50-100 runner-min) plus its one retry (~10-20 min). That
# is a single-job CI, so the waste stays small next to cromford's
# full-corpus batches. 8 is the template's ceiling (bin/mergify-template.sh INTS).
max_parallel_checks=6
# 4 PER BATCH: the template default, written down so the choice is visible.
# One red PR ejects at most 3 innocent siblings.
batch_size=4
# 1 RETRY on the default queue: this is what project-5's committed .mergify.yml
# already runs, so the sync does not quietly change retry behaviour. The
# hotfix queue stays 0 whatever this says.
max_checks_retries=1
