# fly/account-capacity.conf — how many HEAVY concurrent sessions one account of a
# vendor can actually serve (bin/account-capacity.sh).
#
# `<vendor> <sessions-per-account>`, one per line. No line for a vendor = 4.
#
# WHERE THE NUMBER COMES FROM. docs/LESSONS.md #6, "MODEL CAPACITY IS THE
# THROUGHPUT CEILING, NOT HARDWARE": 2-core boxes build fine and every stall was
# account weather — session caps, org spend caps, 429s — with roughly 3-4 heavy
# sessions per account before the account itself becomes the bottleneck. 4 is
# the top of that observed range, so it is the ceiling this file states rather
# than a target to aim at.
#
# WHY IT MATTERS FOR THE POOL. bin/fly-envbundle.sh pushes ONE
# CLAUDE_CODE_OAUTH_TOKEN — the owning box's — to every machine in a project's
# Fly pool (fly-envbundle.sh:58, and :101 refuses a bundle without it). Twenty
# pool machines are therefore twenty heavy sessions on ONE account, not twenty
# accounts' worth of headroom. A pool cap raised past this line buys machines
# that queue behind each other inside the vendor.
#
# METERED API VENDORS ARE NOT LISTED AND MUST NOT BE. grok, openrouter and
# fireworks bill per token with no session ceiling (docs/ACCOUNT-ROUTING.md
# calls them "unmetered" for exactly that reason), so any number here would be
# invented. bin/account-capacity.sh answers `unlimited` for them, and their
# ceiling is a spend cap, not a concurrency one.
#
# A REVIEWED COMMIT, NOT A FLAG. Same reasoning as fly/pool-caps.conf: this
# reaches the hub on its own harness-sync instead of being typed over ssh on a
# box most sessions cannot reach.
claude 4
codex 4
