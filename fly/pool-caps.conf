# fly/pool-caps.conf — per-project HARD ceiling on live Fly pool machines
# (bin/pool-cap.sh). `<project> <n>`, one per line. Synced to every box by
# harness-sync.
#
# EMPTY IS THE NORMAL STATE (the operator, 2026-09-14: "we can launch unlimited builders
# with fly.io"). No line means NO CEILING: bin/pool-cap.sh prints 0 and
# bin/fly-pool.sh spawns one machine per queued build, so the pool follows the
# queue instead of a number we chose. `project-5 20` used to live here and was
# removed with that change — it had been raised by hand 1 -> 10 -> 20 over two
# days, which is what a ceiling nobody needs looks like on the way out.
#
# Write a line ONLY to spend less money than the queue would: a number here is a
# hard ceiling, it survives autoscale, and the pool will sit on work rather than
# exceed it. A NUMBER in flags/fly-pool-<project> on the hub still overrides this
# line; an empty flag file (the enable switch alone) takes the value here.
# POOL_CAP_MAX in env/global.env trims every project at once, unlimited included.
